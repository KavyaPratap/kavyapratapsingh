      <text x="14" y="28" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11">Completion</text>
      <text x="14" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">94.2%</text>
    </g>
