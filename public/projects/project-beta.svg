        <rect width="216" height="46" rx="8" fill="#1F2937" stroke="#374151" />
        <circle cx="22" cy="23" r="10" fill="none" stroke="#6B7280" stroke-width="2" />
        <text x="42" y="27" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Workout &amp; Hydration</text>
