        <rect width="216" height="46" rx="8" fill="#1F2937" />
        <circle cx="22" cy="23" r="10" fill="#10B981" />
        <path d="M 18 23 L 21 26 L 26 19" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="42" y="27" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Kotlin Jetpack Compose</text>
      </g>
      
      <g transform="translate(20, 275)">
        <!-- Habit 3 -->
        <rect width="216" height="46" rx="8" fill="#1F2937" />
        <circle cx="22" cy="23" r="10" fill="#10B981" />
        <path d="M 18 23 L 21 26 L 26 19" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="42" y="27" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Read System Design Docs</text>
