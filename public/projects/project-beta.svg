        <circle cx="22" cy="23" r="10" fill="#10B981" />
        <path d="M 18 23 L 21 26 L 26 19" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="42" y="27" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12" font-weight="500">DSA Practice (2 LeetCode)</text>
      </g>
      
      <g transform="translate(20, 220)">
