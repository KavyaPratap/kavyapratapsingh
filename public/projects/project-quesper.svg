        <text x="12" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">(i) Express surface area S in terms of radius r: S(r) = 2πr² + 2000/r [1 Mark]</text>
        <text x="12" y="34" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">✓ (ii) Find critical radius for minimal cost: r = (500/π)^(1/3) [2 Marks]</text>
      </g>
      
