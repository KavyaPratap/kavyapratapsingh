      <text x="24" y="93" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">✓ Option (a): Both (A) and (R) are true and (R) is the correct explanation of (A).</text>
    </g>
    
    <!-- Question Card 2: Case Study Question -->
    <g transform="translate(20, 178)">
