<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="8" fill="#0A0A0C" />
  
  <!-- Top Navigation Mockup -->
  <rect x="0" y="0" width="800" height="56" fill="#141419" />
  <circle cx="36" cy="28" r="12" fill="#FFFFFF" />
  <path d="M 31 34 L 36 22 L 41 34 Z" fill="#0A0A0C" />
  <text x="58" y="33" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">CloudCanvas</text>
  
  <text x="180" y="32" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="12">Features</text>
  <text x="260" y="32" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Templates</text>
  <text x="348" y="32" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Docs</text>
  <text x="408" y="32" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Showcase</text>
  
  <rect x="680" y="14" width="96" height="28" rx="6" fill="#5B4EE8" />
  <text x="698" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Deploy Now</text>
  
  <!-- Hero Section Preview in App -->
  <g transform="translate(40, 80)">
    <!-- Badge -->
    <rect width="180" height="26" rx="13" fill="#27272A" />
    <circle cx="16" cy="13" r="4" fill="#10B981" />
    <text x="28" y="17" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="11">Next.js 16 + SSR Enabled</text>
    
    <!-- Hero Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Build &amp; Ship Platforms at Scale</text>
    <text x="0" y="95" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">Optimized with server actions, dynamic edge rendering, and sub-second load times.</text>
    
    <!-- Code Editor Box -->
    <g transform="translate(0, 120)">
      <rect width="440" height="240" rx="8" fill="#18181B" stroke="#27272A" />
      <!-- Editor Header -->
      <rect width="440" height="32" rx="8 8 0 0" fill="#27272A" />
      <circle cx="18" cy="16" r="4" fill="#EF4444" />
      <circle cx="32" cy="16" r="4" fill="#F59E0B" />
      <circle cx="46" cy="16" r="4" fill="#10B981" />
      <text x="70" y="20" fill="#A1A1AA" font-family="monospace" font-size="11">app/api/route.ts</text>
      
      <!-- Code lines -->
      <text x="20" y="60" fill="#F43F5E" font-family="monospace" font-size="12">export async function <tspan fill="#60A5FA">GET</tspan><tspan fill="#F43F5E">()</tspan> {</text>
      <text x="40" y="85" fill="#A1A1AA" font-family="monospace" font-size="12">const data = await fetchEdgeData();</text>
      <text x="40" y="110" fill="#F43F5E" font-family="monospace" font-size="12">return <tspan fill="#34D399">Response.json</tspan>({</text>
      <text x="60" y="135" fill="#FBBF24" font-family="monospace" font-size="12">status: "healthy",</text>
      <text x="60" y="160" fill="#FBBF24" font-family="monospace" font-size="12">latency: "14ms",</text>
      <text x="60" y="185" fill="#FBBF24" font-family="monospace" font-size="12">region: "bom1-asia"</text>
      <text x="40" y="210" fill="#F43F5E" font-family="monospace" font-size="12">});</text>
      <text x="20" y="230" fill="#F43F5E" font-family="monospace" font-size="12">}</text>
    </g>
    
    <!-- Deployment Card (Right) -->
    <g transform="translate(460, 120)">
      <rect width="260" height="240" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="20" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Deployment Telemetry</text>
      
      <rect x="20" y="55" width="220" height="46" rx="6" fill="#27272A" />
      <text x="32" y="75" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">STATUS</text>
      <text x="32" y="92" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● Production Ready (Vercel)</text>
      
      <rect x="20" y="115" width="220" height="46" rx="6" fill="#27272A" />
      <text x="32" y="135" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">PERFORMANCE SCORE</text>
      <text x="32" y="152" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ 99/100 Lighthouse</text>
      
      <rect x="20" y="175" width="220" height="46" rx="6" fill="#27272A" />
      <text x="32" y="195" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">GLOBAL EDGE CACHE</text>
      <text x="32" y="212" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">98.4% Hit Ratio</text>
    </g>
  </g>
</svg>
