  <!-- Right: Local AI Generated Code Pane -->
  <g transform="translate(518, 58)">
    <rect width="268" height="428" rx="8" fill="#161B22" stroke="#21262D" />

    <rect x="14" y="12" width="240" height="24" rx="4" fill="#0D1117" />
    <text x="24" y="28" fill="#58A6FF" font-family="monospace" font-size="10">generated_app.py (Python)</text>

    <!-- Syntax Highlighted Code Lines -->
    <g transform="translate(14, 46)">
      <rect width="240" height="368" rx="6" fill="#0D1117" stroke="#30363D" />

      <text x="12" y="22" fill="#FF7B72" font-family="monospace" font-size="10">import</text>
      <text x="56" y="22" fill="#79C0FF" font-family="monospace" font-size="10">tkinter</text>
      <text x="108" y="22" fill="#FF7B72" font-family="monospace" font-size="10">as</text>
      <text x="126" y="22" fill="#F0F6FC" font-family="monospace" font-size="10">tk</text>

      <text x="12" y="40" fill="#FF7B72" font-family="monospace" font-size="10">from</text>
      <text x="42" y="40" fill="#79C0FF" font-family="monospace" font-size="10">tkinter</text>
      <text x="92" y="40" fill="#FF7B72" font-family="monospace" font-size="10">import</text>
      <text x="136" y="40" fill="#FFA657" font-family="monospace" font-size="10">ttk</text>

      <text x="12" y="66" fill="#8B949E" font-family="monospace" font-size="9"># Synthesized by Local AI</text>
      <text x="12" y="80" fill="#FF7B72" font-family="monospace" font-size="10">class</text>
      <text x="48" y="80" fill="#FFA657" font-family="monospace" font-size="10">App</text>
      <text x="70" y="80" fill="#F0F6FC" font-family="monospace" font-size="10">(tk.Tk):</text>

      <text x="24" y="98" fill="#FF7B72" font-family="monospace" font-size="10">def</text>
      <text x="48" y="98" fill="#D2A8FF" font-family="monospace" font-size="10">__init__</text>
      <text x="102" y="98" fill="#F0F6FC" font-family="monospace" font-size="10">(self):</text>

      <text x="36" y="116" fill="#79C0FF" font-family="monospace" font-size="9">super</text>
      <text x="66" y="116" fill="#F0F6FC" font-family="monospace" font-size="9">().__init__()</text>

      <text x="36" y="134" fill="#F0F6FC" font-family="monospace" font-size="9">self.title("GUI")</text>
      <text x="36" y="152" fill="#F0F6FC" font-family="monospace" font-size="9">self.geometry("400x300")</text>

      <text x="36" y="176" fill="#8B949E" font-family="monospace" font-size="9"># Event Handler Wire</text>
      <text x="36" y="192" fill="#F0F6FC" font-family="monospace" font-size="9">self.btn = ttk.Button(</text>
      <text x="48" y="208" fill="#F0F6FC" font-family="monospace" font-size="9">self, text="Login",</text>
      <text x="48" y="224" fill="#FFA657" font-family="monospace" font-size="9">command=self.login</text>
      <text x="36" y="240" fill="#F0F6FC" font-family="monospace" font-size="9">)</text>
      <text x="36" y="258" fill="#F0F6FC" font-family="monospace" font-size="9">self.btn.pack(pady=10)</text>

      <text x="24" y="284" fill="#FF7B72" font-family="monospace" font-size="10">def</text>
      <text x="48" y="284" fill="#D2A8FF" font-family="monospace" font-size="10">login</text>
      <text x="78" y="284" fill="#F0F6FC" font-family="monospace" font-size="10">(self):</text>
      <text x="36" y="300" fill="#7EE787" font-family="monospace" font-size="9"># Generated logic</text>
      <text x="36" y="316" fill="#F0F6FC" font-family="monospace" font-size="9">print("Auth success")</text>

