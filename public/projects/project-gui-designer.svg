    <circle cx="64" cy="54" r="1.5" fill="#30363D" />
    <circle cx="94" cy="54" r="1.5" fill="#30363D" />
    <circle cx="124" cy="54" r="1.5" fill="#30363D" />
    <circle cx="154" cy="54" r="1.5" fill="#30363D" />
    <circle cx="184" cy="54" r="1.5" fill="#30363D" />
