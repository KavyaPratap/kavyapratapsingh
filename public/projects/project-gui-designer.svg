      <rect x="12" y="332" width="216" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
      <text x="20" y="348" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Validated AST · Zero Deprecations</text>
